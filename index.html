<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000080">
  <title>What's Your Type?!</title>

  <!-- Fonts
       computer: VT323, Silkscreen
       ransom headings: Bagel Fat One, Playfair Display, Space Mono, Bungee,
         Archivo Black, Bebas Neue, DM Serif Display, Rubik Mono One, Press Start 2P
       human lines: Instrument Serif (italic) · labels: Space Mono
       + the 16 Type Card result fonts from BRIEF.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bagel+Fat+One&family=Bebas+Neue&family=Bungee&family=Caveat&family=Comfortaa&family=DM+Serif+Display:ital@0;1&family=EB+Garamond&family=Fraunces:ital,wght@0,900;1,300&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@300&family=Monoton&family=Oswald:wght@300&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Press+Start+2P&family=Rubik+Glitch&family=Rubik+Mono+One&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@300&family=Space+Mono:ital,wght@0,400;0,700;1,700&family=Special+Elite&family=Unbounded:wght@300;400;900&family=VT323&family=Work+Sans:wght@100..900&display=swap">

  <!-- Win95 look (MIT) -->
  <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.21/dist/98.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="boot">

  <!-- BOOT SCREEN (full-screen overlay) -->
  <div id="boot" class="boot" hidden>
    <div class="boot-inner">
      <canvas id="boot-logo" class="boot-logo" aria-hidden="true"></canvas>
      <div id="boot-title" class="boot-title"></div>
      <p class="human boot-sub">not your dating type lol, your <span class="cycle-font">typeface</span>!</p>
      <div id="boot-bar" class="boot-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="boot-fill" class="boot-fill"></div>
      </div>
      <p id="boot-status" class="boot-status">Starting up...</p>
      <button id="boot-tap" class="boot-tap" hidden>Tap to start</button>
    </div>
  </div>

  <!-- DESKTOP -->
  <main id="desktop" class="desktop">
    <canvas id="wallpaper" class="wallpaper" aria-hidden="true"></canvas>
    <ul id="icons" class="icons" aria-label="Desktop icons"></ul>

    <!-- The one Paint window that hosts every screen -->
    <section id="paint" class="window paint" aria-label="Paint">
      <div class="title-bar">
        <div class="title-bar-text"><img id="title-icon" class="title-icon" alt="">id2116 - Paint</div>
        <span id="title-timer" class="title-timer" hidden>0:00</span>
        <div class="title-bar-controls">
          <button aria-label="Minimize" data-bonk></button>
          <button aria-label="Maximize" data-bonk></button>
          <button aria-label="Close" data-bonk></button>
        </div>
      </div>

      <nav class="menubar" aria-label="Menu">
        <button data-bonk><u>F</u>ile</button>
        <button data-bonk><u>E</u>dit</button>
        <button id="menu-colors" aria-controls="palette-win" aria-expanded="false"><u>C</u>olors</button>
        <button id="menu-fonts" aria-controls="fonts-win" aria-expanded="false">F<u>o</u>nts</button>
        <button id="menu-help"><u>H</u>elp</button>
      </nav>

      <div class="window-body paint-body">
        <div id="screen" class="screen"></div>
      </div>

      <div class="status-bar">
        <p id="status-step" class="status-bar-field">Step 0 of 9</p>
        <p id="status-name" class="status-bar-field">Boot</p>
        <p id="status-mode" class="status-bar-field">solo</p>
      </div>
    </section>

    <!-- Tool windows: docked right of Paint on laptop (each can be minimised
         to the taskbar), pop-ups from the menu bar on phone -->
    <div class="side-dock">
      <section id="palette-win" class="window tool-win" aria-label="Colors" data-win="colors">
        <div class="title-bar">
          <div class="title-bar-text">Colors</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize" data-min></button>
            <button aria-label="Close" data-close></button>
          </div>
        </div>
        <div class="window-body tool-body">
          <p class="label">Pick a palette</p>
          <div id="palette-list" class="palette-list" role="radiogroup" aria-label="Palettes"></div>
        </div>
      </section>

      <section id="fonts-win" class="window tool-win" aria-label="Fonts" data-win="fonts">
        <div class="title-bar">
          <div class="title-bar-text">Fonts</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize" data-min></button>
            <button aria-label="Close" data-close></button>
          </div>
        </div>
        <div class="window-body tool-body">
          <p class="label">Header fonts</p>
          <div id="fontset-list" class="palette-list" role="radiogroup" aria-label="Font sets"></div>
          <button id="shuffle-btn" class="big">Shuffle</button>
        </div>
      </section>
    </div>
  </main>

  <!-- TASKBAR -->
  <footer class="taskbar">
    <button id="start-btn" class="start-btn" aria-haspopup="menu" aria-expanded="false">
      <img id="start-icon" alt="">Start
    </button>
    <button class="task-btn pressed" tabindex="-1">id2116 - Paint</button>
    <div id="task-wins" class="task-wins"></div>
    <div class="tray">
      <button id="mute-btn" class="mute-btn" aria-label="Mute" aria-pressed="false"><img id="mute-icon" alt=""></button>
      <span id="clock" class="clock">12:00</span>
    </div>
  </footer>

  <div id="start-menu" class="window start-menu" role="menu" hidden>
    <div class="start-side"><span>WYT 3</span></div>
    <div class="start-items">
      <button role="menuitem" data-action="new">New game</button>
      <button role="menuitem" data-action="restart">Restart</button>
      <button role="menuitem" data-action="sounds">Sounds</button>
      <button role="menuitem" data-action="wall">Card wall</button>
      <button role="menuitem" data-action="about">About</button>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
  <!-- QR codes for share links (optional: the code itself works without it) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <!-- Live rooms (optional: solo + compare by code work without it) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- App (order matters: main.js last) -->
  <script src="js/icons.js"></script>
  <script src="js/type.js"></script>
  <script src="js/wallpaper.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/types.js"></script>
  <script src="js/net.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/card.js"></script>
  <script src="js/compat.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
